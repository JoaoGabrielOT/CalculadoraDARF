name: Release

on:
  push:
    tags: ["v*", "[0-9]*"]
    branches: [migracao-flutter]  # só verifica (versão e testes); publicar é só por tag
  workflow_dispatch:  # gera os arquivos para teste, sem publicar release

permissions:
  contents: read

jobs:
  versao:
    runs-on: ubuntu-latest
    outputs:
      versao: ${{ steps.v.outputs.versao }}
      numero: ${{ steps.v.outputs.numero }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir a versão
        id: v
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            T="${GITHUB_REF_NAME}"
            if ! echo "$T" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag fora do formato x.y.z"; exit 1
            fi
            V="${T#v}"
            if [ "${V%%.*}" -lt 2 ]; then
              echo "::error::Tags 1.x são do app Python e saem da main."; exit 1
            fi
          else
            # nunca 0.0.0: um build 0.0.0 ofereceria a 1.12 como atualização
            V=$(sed -nE "s/^const String versaoApp = '([0-9]+\.[0-9]+\.[0-9]+)';.*/\1/p" app/lib/versao.dart)
            if [ -z "$V" ]; then
              echo "::error::Versão não encontrada em app/lib/versao.dart"; exit 1
            fi
          fi
          IFS=. read -r M m p <<< "$V"
          N=$((10#$M * 10000 + 10#$m * 100 + 10#$p))  # 10# evita octal em 08, 09
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "numero=$N" >> "$GITHUB_OUTPUT"
          echo "::notice title=Versão::versao=$V numero=$N"
          echo "versao=$V numero=$N" >> "$GITHUB_STEP_SUMMARY"

  testes:
    needs: versao
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Análise
        working-directory: app
        run: flutter analyze

      - name: Testes
        working-directory: app
        run: flutter test --exclude-tags golden

  android:
    needs: versao
    runs-on: ubuntu-latest
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
      NUMERO: ${{ needs.versao.outputs.numero }}
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos e gravar a keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Segredo ANDROID_KEYSTORE_BASE64 não configurado"; exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Segredo ANDROID_KEYSTORE_PASSWORD não configurado"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Preparar versão e credencial
        shell: pwsh
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            Set-Content -Path app/lib/versao.dart -Encoding utf8 -Value @(
              '/// Versão do aplicativo (comparada com a do GitHub pelo atualizador).',
              "const String versaoApp = '${{ needs.versao.outputs.versao }}';")
          }
          if (-not $env:GOOGLE_CREDENTIALS -or $env:GOOGLE_CREDENTIALS -notmatch '"installed"') {
            Write-Output "::error::Segredo GOOGLE_CREDENTIALS ausente ou sem a chave 'installed'"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path app/assets/google | Out-Null
          Set-Content -Path app/assets/google/credentials.json -Encoding utf8 -Value $env:GOOGLE_CREDENTIALS

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Compilar o APK assinado
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          flutter build apk --release --target-platform android-arm,android-arm64 --build-name "$VERSAO" --build-number "$NUMERO"
          cp build/app/outputs/flutter-apk/app-release.apk ../CalculadoraDARF.apk

      - name: Baixar o APK publicado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern CalculadoraDARF.apk --dir anterior

      - name: Conferir o APK contra o publicado
        run: bash app/ci/conferir_apk.sh CalculadoraDARF.apk "$NUMERO" anterior/CalculadoraDARF.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: CalculadoraDARF.apk

  windows:
    needs: versao
    runs-on: windows-latest
    env:
      VERSAO: ${{ needs.versao.outputs.versao }}
      NUMERO: ${{ needs.versao.outputs.numero }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Preparar versão e credencial
        shell: pwsh
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            Set-Content -Path app/lib/versao.dart -Encoding utf8 -Value @(
              '/// Versão do aplicativo (comparada com a do GitHub pelo atualizador).',
              "const String versaoApp = '${{ needs.versao.outputs.versao }}';")
          }
          if (-not $env:GOOGLE_CREDENTIALS -or $env:GOOGLE_CREDENTIALS -notmatch '"installed"') {
            Write-Output "::error::Segredo GOOGLE_CREDENTIALS ausente ou sem a chave 'installed'"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path app/assets/google | Out-Null
          Set-Content -Path app/assets/google/credentials.json -Encoding utf8 -Value $env:GOOGLE_CREDENTIALS

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Compilar o Windows
        shell: pwsh
        working-directory: app
        run: |
          flutter build windows --release --build-name $env:VERSAO --build-number $env:NUMERO 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/build.log
          if ($LASTEXITCODE -ne 0) {
            # os logs exigem login; as últimas linhas de erro vão como anotação
            $erros = (Select-String -Path $env:RUNNER_TEMP/build.log -Pattern 'error [A-Z]+\d+|CMake Error|Error \(|FAILED:|\.dart:\d+:\d+: Error' | Select-Object -Last 15 | ForEach-Object { $l = $_.Line.Trim(); $l.Substring(0, [Math]::Min(300, $l.Length)) }) -join "`n"
            if (-not $erros) {
              # padrão estreito sem resultado: a anotação nunca fica vazia
              $erros = (Get-Content $env:RUNNER_TEMP/build.log | Select-Object -Last 15 | ForEach-Object { $l = $_.Trim(); $l.Substring(0, [Math]::Min(300, $l.Length)) }) -join "`n"
            }
            $erros = $erros.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Build Windows::$erros"
            exit $LASTEXITCODE
          }

      - name: Implantar as DLLs do runtime do Visual C++
        shell: pwsh
        working-directory: app
        run: |
          $destino = "build\windows\x64\runner\Release"
          # o Release precisa estar completo: a Tarefa 6 empacota esta pasta
          foreach ($item in "calculadoradarf.exe", "flutter_windows.dll", "data\app.so") {
            if (-not (Test-Path "$destino\$item")) {
              Write-Output "::error::$destino\$item ausente"
              exit 1
            }
          }
          # origem preferida: redistribuível oficial da toolset usada no build
          $redist = $null
          $base = $env:VCToolsRedistDir
          if (-not $base) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vs = & $vswhere -latest -products * -property installationPath
              if ($vs) {
                $versao = Get-ChildItem (Join-Path $vs "VC\Redist\MSVC") -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '^\d+(\.\d+)+$' } | Sort-Object { [version]$_.Name } | Select-Object -Last 1
                if ($versao) { $base = $versao.FullName }
              }
            }
          }
          if ($base) {
            $redist = Get-ChildItem (Join-Path $base "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $redist) {
            Write-Output "::warning::Redistribuível do Visual C++ não encontrado; usando System32"
            $redist = Join-Path $env:SystemRoot "System32"
          }
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            $origem = Join-Path $redist $dll
            if (-not (Test-Path $origem)) {
              Write-Output "::error::$origem não encontrada"
              exit 1
            }
            Copy-Item $origem $destino
            $v = (Get-Item $origem).VersionInfo.FileVersion
            Write-Output "::notice title=DLL::$dll de $origem (FileVersion $v)"
          }
          $dlls = (Get-ChildItem $destino -Filter *.dll | ForEach-Object Name) -join ", "
          Write-Output "::notice title=Windows::DLLs em Release: $dlls"
          Write-Output "::notice title=Windows::calculadoradarf.exe, flutter_windows.dll e data\app.so presentes"

      - name: Teste de integração no Windows
        shell: pwsh
        working-directory: app
        run: |
          New-Item -ItemType Directory -Force -Path build\capturas | Out-Null
          flutter test integration_test -d windows --dart-define=CAPTURAS=$env:GITHUB_WORKSPACE\app\build\capturas 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/integracao.log
          if ($LASTEXITCODE -ne 0) {
            $erros = (Get-Content $env:RUNNER_TEMP/integracao.log | Select-Object -Last 15 | ForEach-Object { $l = $_.Trim(); $l.Substring(0, [Math]::Min(300, $l.Length)) }) -join "`n"
            $erros = $erros.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Integração::falhou (código $LASTEXITCODE)%0A$erros"
            exit $LASTEXITCODE
          }
          Write-Output "::notice title=Integração::teste de integração passou"

      - name: Compilar o instalador
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if (-not (Test-Path $iscc)) {
              Write-Output "::error::ISCC.exe não encontrado em $iscc"
              exit 1
            }
          }
          & $iscc "/DVersao=$env:VERSAO" app\instalador\CalculadoraDARF.iss 2>&1 | Tee-Object -FilePath $env:RUNNER_TEMP/iscc.log
          if ($LASTEXITCODE -ne 0) {
            $erros = (Get-Content $env:RUNNER_TEMP/iscc.log | Select-Object -Last 15 | ForEach-Object { $l = $_.Trim(); $l.Substring(0, [Math]::Min(300, $l.Length)) }) -join "`n"
            $erros = $erros.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=ISCC::falhou (código $LASTEXITCODE)%0A$erros"
            exit $LASTEXITCODE
          }
          $tam = [math]::Round((Get-Item app\build\instalador\CalculadoraDARF.exe).Length / 1MB, 1)
          Write-Output "::notice title=Instalador::CalculadoraDARF.exe gerado ($tam MB, versão $env:VERSAO)"

      - name: Testar o instalador
        shell: pwsh
        run: pwsh app\ci\testar_instalador.ps1 -Instalador app\build\instalador\CalculadoraDARF.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/build/instalador/CalculadoraDARF.exe

      - name: Contar as capturas
        if: always()
        shell: pwsh
        run: |
          $n = @(Get-ChildItem app\build\capturas -Filter *.png -ErrorAction SilentlyContinue).Count
          Write-Output "::notice title=Capturas::$n capturas em app/build/capturas"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-windows
          path: app/build/capturas

  publicar:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [versao, testes, android, windows]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: saida

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: saida

      - name: Publicar a release (pré-release até o dono aprovar)
        uses: softprops/action-gh-release@v2
        with:
          name: Calculadora DARF ${{ needs.versao.outputs.versao }}
          files: |
            saida/CalculadoraDARF.exe
            saida/CalculadoraDARF.apk
          prerelease: true     # o atualizador Python e o Flutter usam /releases/latest, que ignora pré-release
          make_latest: "false" # após a aprovação: gh release edit <tag> --prerelease=false --latest, e trocar estas duas linhas
          generate_release_notes: true
          fail_on_unmatched_files: true
