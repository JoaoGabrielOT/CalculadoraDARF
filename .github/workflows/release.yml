name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Definir a versão a partir da tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          Set-Content -Path versao.py -Value "VERSAO = `"$v`"" -Encoding utf8

      - name: Criar credentials.json a partir do segredo
        shell: pwsh
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if ($env:GOOGLE_CREDENTIALS) {
            Set-Content -Path credentials.json -Value $env:GOOGLE_CREDENTIALS -Encoding utf8 -NoNewline
          } else {
            Write-Warning "Segredo GOOGLE_CREDENTIALS ausente: o login com Google não vai funcionar nesta versão."
          }

      - name: Instalar dependências
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Gerar o executável
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path credentials.json) { $extra += @("--add-data", "credentials.json;.") }
          pyinstaller --onefile --noconsole --clean --collect-data customtkinter `
            --collect-all yfinance --collect-all curl_cffi @extra `
            --name CalculadoraDARF calculadora_darf.py

      - name: Publicar a release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CalculadoraDARF.exe
          generate_release_notes: true
